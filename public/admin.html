<!doctype html><html><head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/><title>Admin Dashboard | Tummala Finance</title><link rel="stylesheet" href="/assets/css/styles.css"/></head><body>
<nav class="navbar"><div class="container nav-inner"><div class="brand"><h2>Tummala Finance Admin</h2><p>Trusted Financial Solutions for Your Future</p></div><div class="nav-links"><a href="/">Home</a><a href="/admin">Admin</a></div></div></nav>
<section class="section"><div class="container"><h2>Analytics</h2><div id="analytics" class="grid grid-3"></div></div></section>
<section class="section"><div class="container grid grid-2"><div class="card"><h3>Users</h3><div class="table-wrap"><table><thead><tr><th>Name</th><th>Email</th><th>Role</th></tr></thead><tbody id="userRows"></tbody></table></div></div><div class="card"><h3>Contact Inquiries</h3><div class="table-wrap"><table><thead><tr><th>Name</th><th>Email</th><th>Status</th></tr></thead><tbody id="contactRows"></tbody></table></div></div></div></section>
<section class="section"><div class="container"><div class="card"><h3>Content Management</h3><form id="contentForm" class="grid grid-3"><input name="key" placeholder="content key (e.g. home-hero)" required/><input name="title" placeholder="Title" required/><input name="content" placeholder="Content" required/><button class="btn btn-primary" type="submit">Save Content</button></form><p id="contentMsg" class="muted"></p></div></div></section>
<script src="/assets/js/common.js"></script><script src="/assets/js/admin.js"></script>
</body></html>
