<!doctype html><html><head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/><title>User Dashboard | Tummala Finance</title><link rel="stylesheet" href="/assets/css/styles.css"/></head><body>
<nav class="navbar"><div class="container nav-inner"><div class="brand"><h2>Tummala Finance</h2><p>Trusted Financial Solutions for Your Future</p></div><div class="nav-links"><a href="/">Home</a><a href="/dashboard">Dashboard</a></div></div></nav>
<section class="section"><div class="container grid grid-2"><div class="card"><h2>Login / Register</h2><form id="registerForm" class="form-grid"><input name="name" placeholder="Name" required/><input name="email" type="email" placeholder="Email" required/><input name="phone" placeholder="Phone"/><input name="password" type="password" placeholder="Password" required/><button class="btn btn-primary" type="submit">Register</button></form><hr/><form id="loginForm" class="form-grid"><input name="email" type="email" placeholder="Email" required/><input name="password" type="password" placeholder="Password" required/><button class="btn btn-primary" type="submit">Login</button></form><p id="authMsg" class="muted"></p></div>
<div class="card"><h2>Apply for Loan</h2><form id="loanForm" class="form-grid" enctype="multipart/form-data"><input name="applicantName" placeholder="Applicant Name" required/><select name="loanType" required><option>Gold Loan</option><option>Personal Loan</option><option>Business Loan</option><option>Insurance</option><option>Investments</option></select><input name="loanAmount" type="number" placeholder="Loan Amount" required/><input name="interestRate" type="number" placeholder="Interest Rate" required/><input name="tenureMonths" type="number" placeholder="Tenure Months" required/><input name="document" type="file" accept=".pdf,.png,.jpg,.jpeg"/><button class="btn btn-primary" type="submit">Submit Application</button></form><p id="loanMsg" class="muted"></p></div></div></section>
<section class="section"><div class="container"><h2>My Applications</h2><div class="table-wrap"><table><thead><tr><th>Type</th><th>Amount</th><th>Status</th><th>PDF</th></tr></thead><tbody id="loanRows"></tbody></table></div></div></section>
<script src="/assets/js/common.js"></script><script src="/assets/js/dashboard.js"></script>
</body></html>
